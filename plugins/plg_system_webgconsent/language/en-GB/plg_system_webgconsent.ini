PLG_SYSTEM_WEBGCONSENT="System - WebG Consent"
PLG_SYSTEM_WEBGCONSENT_XML_DESCRIPTION="Full-page modal (age gate) for sites with content reserved for adults, with a pseudonymous consent register. Texts are editable per language in the plugin settings. Works with page caches: the modal is built in the browser. The plugin stays disabled after first install."
PLG_SYSTEM_WEBGCONSENT_PREFLIGHT_PHP="WebG Consent requires PHP %s or higher."
PLG_SYSTEM_WEBGCONSENT_PREFLIGHT_JOOMLA="WebG Consent requires Joomla %s or higher."
PLG_SYSTEM_WEBGCONSENT_POSTINSTALL="WebG Consent installed and DISABLED. Review texts and parameters, then enable it from the plugin settings."
PLG_SYSTEM_WEBGCONSENT_FS_TEXT="Text"
PLG_SYSTEM_WEBGCONSENT_FS_LOOK="Look"
PLG_SYSTEM_WEBGCONSENT_FS_BEHAVIOUR="Behaviour"
PLG_SYSTEM_WEBGCONSENT_FS_REGISTER="Consent register"
PLG_SYSTEM_WEBGCONSENT_F_VERSION="Text version (manual part)"
PLG_SYSTEM_WEBGCONSENT_F_VERSION_DESC="Letters, numbers, dash and underscore, max 24 characters. A fingerprint of the texts below is appended automatically: editing a text asks for consent again. Change this field by hand only if you edit language files or want to force a new request."
PLG_SYSTEM_WEBGCONSENT_F_TEXTS="Texts per language"
PLG_SYSTEM_WEBGCONSENT_F_TEXTS_DESC="One row per language. Visitors get the row for the active page language; if missing, the All languages row; if missing too, the default text from the language files (Italian and English). Empty fields use the text of the language files, which can also be changed in System, Language Overrides (keys PLG_SYSTEM_WEBGCONSENT_DEF_*). If you change an override, change the text version too."
PLG_SYSTEM_WEBGCONSENT_F_LANG="Language"
PLG_SYSTEM_WEBGCONSENT_OPT_ALL="All languages"
PLG_SYSTEM_WEBGCONSENT_F_TITLE="Title"
PLG_SYSTEM_WEBGCONSENT_F_BODY="Modal text"
PLG_SYSTEM_WEBGCONSENT_F_BODY_DESC="One line = one paragraph. Plain text only, no HTML."
PLG_SYSTEM_WEBGCONSENT_F_BTN_ACCEPT="Accept button"
PLG_SYSTEM_WEBGCONSENT_F_BTN_EXIT="Exit button"
PLG_SYSTEM_WEBGCONSENT_F_FOOTNOTE="Note about the register"
PLG_SYSTEM_WEBGCONSENT_F_PRIVACY_LABEL="Privacy link text"
PLG_SYSTEM_WEBGCONSENT_F_ROW_PRIVACY_URL="Privacy policy address (this language)"
PLG_SYSTEM_WEBGCONSENT_F_ROW_PRIVACY_URL_DESC="Optional. If empty the general address below is used."
PLG_SYSTEM_WEBGCONSENT_F_EXIT_URL="Exit address"
PLG_SYSTEM_WEBGCONSENT_F_EXIT_URL_DESC="Where the exit button leads. Must start with http:// or https://. Choose a neutral site."
PLG_SYSTEM_WEBGCONSENT_F_PRIVACY_URL="Privacy policy address"
PLG_SYSTEM_WEBGCONSENT_F_PRIVACY_URL_DESC="Site path (starting with /) or a full address. Leave empty to hide the link."
PLG_SYSTEM_WEBGCONSENT_F_C_OVERLAY="Backdrop colour"
PLG_SYSTEM_WEBGCONSENT_F_OVERLAY_OPACITY="Backdrop opacity (50-100)"
PLG_SYSTEM_WEBGCONSENT_F_C_PANEL="Panel colour"
PLG_SYSTEM_WEBGCONSENT_F_C_TEXT="Text colour"
PLG_SYSTEM_WEBGCONSENT_F_C_ACCEPT_BG="Accept button, background"
PLG_SYSTEM_WEBGCONSENT_F_C_ACCEPT_TEXT="Accept button, text"
PLG_SYSTEM_WEBGCONSENT_F_C_EXIT_BORDER="Exit button, border"
PLG_SYSTEM_WEBGCONSENT_F_C_EXIT_TEXT="Exit button, text"
PLG_SYSTEM_WEBGCONSENT_F_COOKIE_DAYS="Consent duration (days)"
PLG_SYSTEM_WEBGCONSENT_F_COOKIE_DAYS_DESC="Lifetime of the technical cookie wgc_ok. When it expires the modal shows again."
PLG_SYSTEM_WEBGCONSENT_F_COOKIE_DOMAIN="Cookie domain (optional)"
PLG_SYSTEM_WEBGCONSENT_F_COOKIE_DOMAIN_DESC="Normally leave empty: the cookie is valid for the current host name only (www.example.com and example.com would be two different cookies). To share it, enter the domain without www, for example example.com. A permanent 301 redirect from one name to the other is better anyway."
PLG_SYSTEM_WEBGCONSENT_F_EXCLUDE="Paths excluded from the modal"
PLG_SYSTEM_WEBGCONSENT_F_EXCLUDE_DESC="One path per line, must start with /. Used as a prefix: /privacy-policy also excludes /privacy-policy.html. Privacy and cookie policy are usually excluded so they can be read before accepting."
PLG_SYSTEM_WEBGCONSENT_F_LOG_ENABLED="Record consent"
PLG_SYSTEM_WEBGCONSENT_F_RETENTION="Register retention (days)"
PLG_SYSTEM_WEBGCONSENT_F_RETENTION_DESC="Older records are deleted automatically (gradual clean-up on each record)."
PLG_SYSTEM_WEBGCONSENT_F_RATE="Records per IP every 10 minutes"
PLG_SYSTEM_WEBGCONSENT_F_RATE_DESC="Abuse protection for the recording endpoint. Over the limit requests are refused."
PLG_SYSTEM_WEBGCONSENT_F_TRUST_CF="The site is behind Cloudflare"
PLG_SYSTEM_WEBGCONSENT_F_TRUST_CF_DESC="Yes: the visitor IP (used only for the fingerprint and the limit) is read from the CF-Connecting-IP header. No: from REMOTE_ADDR. The per-IP limit is reliable only if the server accepts connections from Cloudflare only."
PLG_SYSTEM_WEBGCONSENT_F_SALT="Extra salt (optional)"
PLG_SYSTEM_WEBGCONSENT_F_SALT_DESC="Added to the site secret to compute the IP fingerprint. If changed, new fingerprints are no longer comparable with old ones."
PLG_SYSTEM_WEBGCONSENT_F_DELETE="Delete the register on uninstall"
PLG_SYSTEM_WEBGCONSENT_F_DELETE_DESC="Default NO: the register is evidence and survives uninstalling the plugin."
PLG_SYSTEM_WEBGCONSENT_F_REGISTRO="Register"
PLG_SYSTEM_WEBGCONSENT_REG_INFO="Visitor choices (accepted or declined, date, text version, IP fingerprint) are recorded in a database table. They are not shown here: download the CSV to review them."
PLG_SYSTEM_WEBGCONSENT_REG_EXPORT="Export all as CSV"
PLG_SYSTEM_WEBGCONSENT_REG_EXPORT_HINT="For a date range append &from=YYYY-MM-DD&to=YYYY-MM-DD to the link. Semicolon separator, dates in UTC."
PLG_SYSTEM_WEBGCONSENT_DEF_TITLE="Content for adults only"
PLG_SYSTEM_WEBGCONSENT_DEF_BODY="This site contains content intended exclusively for adults.\nTo enter you must be at least 18 years old and freely choose to view this content.\nBy pressing the button you declare that you are of legal age and wish to continue."
PLG_SYSTEM_WEBGCONSENT_DEF_ACCEPT="I am 18 or older, enter"
PLG_SYSTEM_WEBGCONSENT_DEF_EXIT="Leave"
PLG_SYSTEM_WEBGCONSENT_DEF_NOTE="Your choice is recorded pseudonymously, without your IP address in clear, to be able to show that the check was carried out."
PLG_SYSTEM_WEBGCONSENT_DEF_PRIVACY="Privacy policy"
