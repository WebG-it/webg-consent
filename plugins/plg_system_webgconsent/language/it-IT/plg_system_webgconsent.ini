PLG_SYSTEM_WEBGCONSENT="Sistema - WebG Consent"
PLG_SYSTEM_WEBGCONSENT_XML_DESCRIPTION="Modale a tutta pagina (age gate) per siti con contenuti riservati ai maggiorenni, con registro pseudonimo del consenso. Il testo si modifica dalla scheda del plugin, per lingua. Funziona anche con le cache di pagina: il modale nasce nel browser. Alla prima installazione il plugin resta disabilitato."
PLG_SYSTEM_WEBGCONSENT_PREFLIGHT_PHP="Per WebG Consent serve PHP %s o superiore."
PLG_SYSTEM_WEBGCONSENT_PREFLIGHT_JOOMLA="Per WebG Consent serve Joomla %s o superiore."
PLG_SYSTEM_WEBGCONSENT_POSTINSTALL="WebG Consent installato e DISABILITATO. Controlla testo e parametri, poi abilitalo dalla scheda del plugin."
PLG_SYSTEM_WEBGCONSENT_FS_TEXT="Testo"
PLG_SYSTEM_WEBGCONSENT_FS_LOOK="Aspetto"
PLG_SYSTEM_WEBGCONSENT_FS_BEHAVIOUR="Comportamento"
PLG_SYSTEM_WEBGCONSENT_FS_REGISTER="Registro del consenso"
PLG_SYSTEM_WEBGCONSENT_F_VERSION="Versione del testo (parte manuale)"
PLG_SYSTEM_WEBGCONSENT_F_VERSION_DESC="Lettere, numeri, trattino e underscore, massimo 24 caratteri. Alla versione si aggiunge da sola un'impronta dei testi inseriti qui sotto: se modifichi un testo il consenso viene richiesto di nuovo. Cambia questo campo a mano solo se modifichi i file lingua o vuoi forzare una nuova richiesta."
PLG_SYSTEM_WEBGCONSENT_F_TEXTS="Testi per lingua"
PLG_SYSTEM_WEBGCONSENT_F_TEXTS_DESC="Una riga per lingua. Il visitatore vede la riga della lingua attiva della pagina; se manca, la riga Tutte le lingue; se manca anche quella, il testo predefinito dei file lingua (italiano e inglese). I campi lasciati vuoti usano il testo dei file lingua, che si cambia anche da Sistema, Override lingua (chiavi PLG_SYSTEM_WEBGCONSENT_DEF_*). Se cambi un override, cambia anche la versione del testo."
PLG_SYSTEM_WEBGCONSENT_F_LANG="Lingua"
PLG_SYSTEM_WEBGCONSENT_OPT_ALL="Tutte le lingue"
PLG_SYSTEM_WEBGCONSENT_F_TITLE="Titolo"
PLG_SYSTEM_WEBGCONSENT_F_BODY="Testo del modale"
PLG_SYSTEM_WEBGCONSENT_F_BODY_DESC="Una riga = un paragrafo. Solo testo semplice, niente HTML."
PLG_SYSTEM_WEBGCONSENT_F_BTN_ACCEPT="Pulsante di accettazione"
PLG_SYSTEM_WEBGCONSENT_F_BTN_EXIT="Pulsante di uscita"
PLG_SYSTEM_WEBGCONSENT_F_FOOTNOTE="Nota sulla registrazione"
PLG_SYSTEM_WEBGCONSENT_F_PRIVACY_LABEL="Testo del link alla privacy"
PLG_SYSTEM_WEBGCONSENT_F_ROW_PRIVACY_URL="Indirizzo della privacy policy (questa lingua)"
PLG_SYSTEM_WEBGCONSENT_F_ROW_PRIVACY_URL_DESC="Facoltativo. Se vuoto vale l'indirizzo generale qui sotto."
PLG_SYSTEM_WEBGCONSENT_F_EXIT_URL="Indirizzo di uscita"
PLG_SYSTEM_WEBGCONSENT_F_EXIT_URL_DESC="Dove va chi preme il pulsante di uscita. Deve iniziare con http:// o https://. Scegli un sito neutro."
PLG_SYSTEM_WEBGCONSENT_F_PRIVACY_URL="Indirizzo della privacy policy"
PLG_SYSTEM_WEBGCONSENT_F_PRIVACY_URL_DESC="Percorso del sito (inizia con /) o indirizzo completo. Lascia vuoto per non mostrare il link."
PLG_SYSTEM_WEBGCONSENT_F_C_OVERLAY="Colore dello sfondo"
PLG_SYSTEM_WEBGCONSENT_F_OVERLAY_OPACITY="Opacità dello sfondo (50-100)"
PLG_SYSTEM_WEBGCONSENT_F_C_PANEL="Colore del riquadro"
PLG_SYSTEM_WEBGCONSENT_F_C_TEXT="Colore del testo"
PLG_SYSTEM_WEBGCONSENT_F_C_ACCEPT_BG="Pulsante di accettazione, sfondo"
PLG_SYSTEM_WEBGCONSENT_F_C_ACCEPT_TEXT="Pulsante di accettazione, testo"
PLG_SYSTEM_WEBGCONSENT_F_C_EXIT_BORDER="Pulsante di uscita, bordo"
PLG_SYSTEM_WEBGCONSENT_F_C_EXIT_TEXT="Pulsante di uscita, testo"
PLG_SYSTEM_WEBGCONSENT_F_COOKIE_DAYS="Durata del consenso (giorni)"
PLG_SYSTEM_WEBGCONSENT_F_COOKIE_DAYS_DESC="Durata del cookie tecnico wgc_ok. Alla scadenza il modale ricompare."
PLG_SYSTEM_WEBGCONSENT_F_COOKIE_DOMAIN="Dominio del cookie (facoltativo)"
PLG_SYSTEM_WEBGCONSENT_F_COOKIE_DOMAIN_DESC="Lascia vuoto di norma: il cookie vale solo per il nome host corrente (www.esempio.it e esempio.it sarebbero due cookie diversi). Per condividerlo scrivi il dominio senza www, per esempio esempio.it. Meglio comunque un redirect 301 permanente da un nome all'altro."
PLG_SYSTEM_WEBGCONSENT_F_EXCLUDE="Percorsi esclusi dal modale"
PLG_SYSTEM_WEBGCONSENT_F_EXCLUDE_DESC="Un percorso per riga, deve iniziare con /. Vale come prefisso: /privacy-policy esclude anche /privacy-policy.html. Di norma si escludono privacy e cookie policy, così si possono leggere prima di accettare."
PLG_SYSTEM_WEBGCONSENT_F_LOG_ENABLED="Registra il consenso"
PLG_SYSTEM_WEBGCONSENT_F_RETENTION="Conservazione del registro (giorni)"
PLG_SYSTEM_WEBGCONSENT_F_RETENTION_DESC="I record più vecchi vengono cancellati in automatico (pulizia progressiva a ogni registrazione)."
PLG_SYSTEM_WEBGCONSENT_F_RATE="Limite registrazioni per IP ogni 10 minuti"
PLG_SYSTEM_WEBGCONSENT_F_RATE_DESC="Protezione contro gli abusi dell'endpoint di registrazione. Oltre il limite le richieste vengono rifiutate."
PLG_SYSTEM_WEBGCONSENT_F_TRUST_CF="Il sito è dietro Cloudflare"
PLG_SYSTEM_WEBGCONSENT_F_TRUST_CF_DESC="Sì: l'IP del visitatore (usato solo per l'impronta e per il limite) si legge dall'intestazione CF-Connecting-IP. No: da REMOTE_ADDR. Il limite per IP è affidabile solo se il server accetta soltanto connessioni da Cloudflare."
PLG_SYSTEM_WEBGCONSENT_F_SALT="Sale aggiuntivo (facoltativo)"
PLG_SYSTEM_WEBGCONSENT_F_SALT_DESC="Si somma al segreto del sito per calcolare l'impronta dell'IP. Cambiandolo, le impronte nuove non sono più confrontabili con le vecchie."
PLG_SYSTEM_WEBGCONSENT_F_DELETE="Cancella il registro alla disinstallazione"
PLG_SYSTEM_WEBGCONSENT_F_DELETE_DESC="Di default NO: il registro è una prova e sopravvive alla disinstallazione del plugin."
PLG_SYSTEM_WEBGCONSENT_F_REGISTRO="Registro"
PLG_SYSTEM_WEBGCONSENT_REG_INFO="Le scelte dei visitatori (accettato o rifiutato, data, versione del testo, impronta dell'IP) sono registrate in una tabella del database. Qui non vengono mostrate: si consultano scaricando il CSV."
PLG_SYSTEM_WEBGCONSENT_REG_EXPORT="Esporta tutto in CSV"
PLG_SYSTEM_WEBGCONSENT_REG_EXPORT_HINT="Per un intervallo aggiungi &from=AAAA-MM-GG&to=AAAA-MM-GG al link. Separatore punto e virgola, date in UTC."
PLG_SYSTEM_WEBGCONSENT_DEF_TITLE="Contenuti per un pubblico adulto"
PLG_SYSTEM_WEBGCONSENT_DEF_BODY="Questo sito contiene contenuti pensati esclusivamente per un pubblico adulto.\nPer entrare devi avere almeno 18 anni e scegliere liberamente di vedere questi contenuti.\nPremendo il pulsante dichiari di essere maggiorenne e di voler proseguire."
PLG_SYSTEM_WEBGCONSENT_DEF_ACCEPT="Ho 18 anni o più, entro"
PLG_SYSTEM_WEBGCONSENT_DEF_EXIT="Esco"
PLG_SYSTEM_WEBGCONSENT_DEF_NOTE="La tua scelta viene registrata in forma pseudonima, senza indirizzo IP in chiaro, per poter dimostrare che il controllo è stato effettuato."
PLG_SYSTEM_WEBGCONSENT_DEF_PRIVACY="Informativa sulla privacy"
