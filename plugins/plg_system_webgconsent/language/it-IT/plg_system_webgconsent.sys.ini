PLG_SYSTEM_WEBGCONSENT="Sistema - WebG Consent"
PLG_SYSTEM_WEBGCONSENT_XML_DESCRIPTION="Modale a tutta pagina (age gate) per siti con contenuti riservati ai maggiorenni, con registro pseudonimo del consenso. Il testo si modifica dalla scheda del plugin, per lingua. Funziona anche con le cache di pagina: il modale nasce nel browser. Alla prima installazione il plugin resta disabilitato."
